services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: personal_finance_app
    working_dir: /var/www/html
    command: bash docker/php/start.sh
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www/html
    environment:
      # artisan serve atiende una petición a la vez si no se le dan workers.
      PHP_CLI_SERVER_WORKERS: 4
      APP_ENV: local
      # Con debug activo, cualquier error muestra la traza y la configuración a quien abra la web.
      APP_DEBUG: "${APP_DEBUG:-false}"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: personal_finance
      DB_USERNAME: laravel
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      OLLAMA_TIMEOUT: 1200
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: personal_finance_worker
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      # Con debug activo, cualquier error muestra la traza y la configuración a quien abra la web.
      APP_DEBUG: "${APP_DEBUG:-false}"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: personal_finance
      DB_USERNAME: laravel
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      OLLAMA_TIMEOUT: 1200
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: personal_finance_scheduler
    working_dir: /var/www/html
    command: php artisan schedule:work --verbose --no-interaction
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      # Con debug activo, cualquier error muestra la traza y la configuración a quien abra la web.
      APP_DEBUG: "${APP_DEBUG:-false}"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: personal_finance
      DB_USERNAME: laravel
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      OLLAMA_TIMEOUT: 1200
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: personal_finance_db
    restart: unless-stopped
    ports:
      # Solo desde la propia máquina: la base de datos no debe quedar abierta a la red.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: personal_finance
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d personal_finance"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
